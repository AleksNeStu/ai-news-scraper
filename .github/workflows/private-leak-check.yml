# =====================================================
# Private-leak-check CI gate.
#
# Single job scans both:
#   1. every tracked file in the repo
#   2. the body of every commit in the push / pull_request range
#
# The canonical pattern list lives in scripts/private-leak-check.sh;
# this workflow only invokes it. Workflow name and step labels use
# generic terms to avoid self-triggers.
# =====================================================

name: private-leak-check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: leak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    # 10 minutes — the scan pipes every text tracked file through a bash
    # read-loop + grep. With the previous 5-minute budget the scan timed
    # out once the repo crossed the ~18MB `demo/demo.gif` + 1.3MB of
    # lockfile mass. Even with the binary/lockfile excludes below, leave
    # headroom for the line-wrap pair-scan buffer (O(n) lines + O(n-1)
    # pairs all loaded into bash memory).
    timeout-minutes: 10
    steps:
      - name: checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: scan tracked files
        run: |
          set -euo pipefail
          # Exclude the script itself — its source contains the canonical
          # pattern list as a heredoc, so a naive scan produces self-flags.
          # The script is reviewed manually; CI enforces the rule on
          # everything ELSE in the tracked tree.
          #
          # Exclude the demo gif and PNGs (binary — bash read-loop is
          # O(n) per byte and there's no regex match possible against
          # binary noise; they push the previous scan past 5 minutes).
          #
          # Exclude the lockfiles (`poetry.lock`, `pnpm-lock.yaml`) and
          # generated nested copies under `apps/api/poetry.lock` — these
          # are machine-generated and would never contain human-written
          # identifiers, so a regex scan is wasted work.
          git ls-files -z -- \
              ':!scripts/private-leak-check.sh' \
              ':!demo/demo.gif' \
              ':!demo/*.png' \
              ':!poetry.lock' \
              ':!pnpm-lock.yaml' \
              ':!apps/api/poetry.lock' \
            | xargs -0 cat \
            | bash scripts/private-leak-check.sh

      - name: scan commit messages (push)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # On the first commit of a branch, BEFORE is all zeros; resolve
          # to the root commit's parent so the range covers every new commit.
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            BEFORE=$(git rev-list --max-parents=0 HEAD)
          fi
          # Force-pushes rewrite history; the BEFORE ref may no longer be
          # reachable from HEAD. In that case, fall back to scanning just
          # the new HEAD commit's message -- which is what the user
          # actually pushed. The PR-introduced scan below is the more
          # thorough check (it sees every commit the contributor is
          # proposing to merge).
          MSG_FILE=$(mktemp)
          if git log -1 --format=%B "$AFTER" > "$MSG_FILE" 2>/dev/null && \
             git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            # Normal fast-forward push: scan the full BEFORE..AFTER range.
            git log "${BEFORE}..${AFTER}" --format=%B > "$MSG_FILE"
          fi
          bash scripts/private-leak-check.sh --message "$MSG_FILE"
          rm -f "$MSG_FILE"

      - name: scan commit messages (pull_request)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Scan only the commits INTRODUCED BY THIS PR, not the full
          # base..head range. ``git log BASE..HEAD`` would include
          # every commit on the working branch since it diverged from
          # base -- which, on a long-lived dev branch with frequent
          # force-pushes (see project memory: 2026-07-05 author-rewrite
          # + message-body scrub), can include historical commits with
          # pre-cleanup messages. The PR API gives us the actual set
          # of commits the user is proposing to merge.
          PR_NUMBER="${{ github.event.pull_request.number }}"
          MSG_FILE=$(mktemp)
          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" \
            --jq '.[].commit.message' \
            > "$MSG_FILE"
          bash scripts/private-leak-check.sh --message "$MSG_FILE"
          rm -f "$MSG_FILE"
