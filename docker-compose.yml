# =====================================================
# AI News Scraper — docker compose for local dev
# =====================================================
#
# First-time setup is fully automatic: `migrate` runs Alembic upgrade
# head then applies seed.sql, and the `api` service waits for it via
# `service_completed_successfully`. After that, the full stack comes up
# with one dev user (`alex@example.com` / `dev-only-do-not-use-in-prod`),
# two RSS feeds, four articles, and four feed_items already loaded —
# a fresh clone needs only `docker compose up`.
#
# Bind mounts on `api` and `web` are dev-only (live host-edit of source
# without rebuilding). Production shape (Option A from
# .agent/adr/014-deploy-target.md) drops these; ADR-014 §14.7 lists the
# other prod-time hardening items (mem_limit, prod-env footguns, etc.)
# out of scope for this change.
# =====================================================

services:
  db:
    image: postgres:16-alpine
    container_name: ai-news-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_news
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-news-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    # Pinned to 0.5.20 to match `chromadb = "^0.5.20"` in
    # apps/api/pyproject.toml. Pinning note: chromadb v1.5.7+ removed
    # `curl` from the image, breaking the cookbook-recommended
    # healthcheck (chroma-core/chroma#6855). The 0.5.x line is what the
    # Python client is built against. To work around the missing curl we
    # call the heartbeat via ``python -c`` (python3:3.12-alpine ships in
    # the image); ``start_period`` tolerates the slow first boot.
    image: chromadb/chroma:0.5.20
    container_name: ai-news-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  migrate:
    # One-shot init: Alembic upgrade head, then apply seed.sql
    # (idempotent — every INSERT uses ON CONFLICT DO NOTHING). api waits
    # for this with `service_completed_successfully`. Re-runs on every
    # `docker compose up`; both steps are no-ops if already at head.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ai-news-api:migrate
    container_name: ai-news-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ai_news
    command: ["sh", "-c", "alembic upgrade head && python -m api.scripts.seed"]
    working_dir: /app/apps/api
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-news-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: "8082"
      API_INTERNAL_URL: http://api:8082
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ai_news
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/ai_news
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # UNSUBSCRIBE_JWT_SECRET defaults to empty in config.py, which causes
      # /unsubscribe to 500 (Devil's G3 / ADR-014 §14.7). Provide a dev
      # placeholder so the digest-unsubscribe endpoint works locally.
      UNSUBSCRIBE_JWT_SECRET: ${UNSUBSCRIBE_JWT_SECRET:-dev-unsubscribe-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8082:8082"
    volumes:
      # Dev-only bind mounts — live-edit source without rebuilding.
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request as u; u.urlopen('http://localhost:8082/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai-news-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:8082
      NEXT_PUBLIC_API_URL: http://localhost:8082
    ports:
      - "3000:3000"
    volumes:
      # Dev-only bind mount — see api note.
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
    healthcheck:
      # node:22-alpine ships busybox `wget`. /api/backend/health rewrite
      # is on the server side; the index route is enough for liveness.
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  chromadata:
