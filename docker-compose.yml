# =====================================================
# AI News Scraper — docker compose for local dev
# =====================================================
#
# First-time setup is fully automatic: `migrate` runs Alembic upgrade
# head then applies seed.sql, and the `api` service waits for it via
# `service_completed_successfully`. After that, the full stack comes up
# with one dev user (`alex@example.com` / `dev-only-do-not-use-in-prod`),
# two RSS feeds, four articles, and four feed_items already loaded —
# a fresh clone needs only `docker compose up`.
#
# Bind mounts on `api` and `web` are dev-only (live host-edit of source
# without rebuilding). Production shape (Option A from
# .agent/adr/014-deploy-target.md) drops these; ADR-014 §14.7 lists the
# other prod-time hardening items (mem_limit, prod-env footguns, etc.)
# out of scope for this change.
# =====================================================

services:
  db:
    image: postgres:16-alpine
    container_name: ai-news-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_news
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-news-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    # Pinned to 0.5.20 to match `chromadb = "^0.5.20"` in
    # apps/api/pyproject.toml. Pinning note: chromadb v1.5.7+ removed
    # `curl` from the image, breaking the cookbook-recommended
    # healthcheck (chroma-core/chroma#6855). The 0.5.x line is what the
    # Python client is built against. To work around the missing curl we
    # call the heartbeat via ``python -c`` (python3:3.12-alpine ships in
    # the image); ``start_period`` tolerates the slow first boot.
    image: chromadb/chroma:0.5.20
    container_name: ai-news-chroma
    restart: unless-stopped
    ports:
      - "8500:8000"
    volumes:
      - chromadata:/chroma/chroma
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  migrate:
    # One-shot init: Alembic upgrade head, then apply seed.sql
    # (idempotent — every INSERT uses ON CONFLICT DO NOTHING). api waits
    # for this with `service_completed_successfully`. Re-runs on every
    # `docker compose up`; both steps are no-ops if already at head.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ai-news-api:migrate
    container_name: ai-news-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ai_news
    command: ["sh", "-c", "alembic upgrade head && python -m api.scripts.seed"]
    working_dir: /app/apps/api
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-news-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      # Container port is 8000 (uvicorn / FastAPI default). Host port
      # is 8007 — allocated by the canonical port-registry file (range
      # 8000-8099, +1 per project). See ``apps/api/Dockerfile`` and
      # ``apps/api/api/config.py`` for the same comment. The web
      # container reaches the api via the compose-network DNS name
      # ``api:8000`` (container port), not the host port 8007.
      API_PORT: "8000"
      API_INTERNAL_URL: http://api:8000
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ai_news
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/ai_news
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # UNSUBSCRIBE_JWT_SECRET defaults to empty in config.py, which causes
      # /unsubscribe to 500 (Devil's G3 / ADR-014 §14.7). Provide a dev
      # placeholder so the digest-unsubscribe endpoint works locally.
      UNSUBSCRIBE_JWT_SECRET: ${UNSUBSCRIBE_JWT_SECRET:-dev-unsubscribe-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8007:8000"
    volumes:
      # Dev-only bind mounts — live-edit source without rebuilding.
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # ``next.config.ts`` reads ``API_INTERNAL_URL`` at build time, so
      # the value must be passed as a build arg. Uses the container
      # port (8000), not the host port (8007) — the rewrite is served
      # by the api container over the compose network. See
      # ``apps/web/Dockerfile`` for the full chain.
      args:
        API_INTERNAL_URL: http://api:8000
    container_name: ai-news-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Backend host port = 8007 (per the canonical port-registry file);
      # this is what the browser uses to reach the api.
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8007
    ports:
      - "3807:3000"
    volumes:
      # Dev-only bind mounts — see api note. We mount only ``src`` and
      # ``public`` subdirectories instead of the whole ``apps/web`` because
      # the web image copies the Next.js standalone output into
      # ``/app/apps/web`` (notably ``server.js`` and ``.next/``). A blanket
      # ``./apps/web:/app/apps/web`` mount overwrites those built artifacts
      # with the host's source-only tree, and ``node apps/web/server.js``
      # fails with ``Cannot find module .../server.js``. Sub-path mounts
      # keep the standalone server intact while still allowing source
      # hot-reload via Next's filesystem watcher.
      - ./apps/web/src:/app/apps/web/src:ro
      - ./apps/web/public:/app/apps/web/public:ro
      - ./packages:/app/packages
    healthcheck:
      # node:22-alpine ships busybox ``wget``. The app uses ``[locale]``
      # routing (Next.js i18n) so the literal ``/`` route resolves to
      # ``not-found.tsx`` and returns 404 — which fails ``wget --spider``.
      # Probe ``/en`` (default locale prefix, renders the locale home)
      # which returns 200 once the server is up.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/en || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  chromadata:
